<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', path='/questions.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/answer.css') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='imgs/favicon.png') }}">
    <script src="{{ url_for('static', path='js/questions.js') }}" defer></script>
    <title>Вопросы</title>
</head>
<body>
    <div class="header">
        <header class="header-inner container">
            <a class="header-logo" href="/">
                <img src="{{ url_for('static', path='imgs/logo.png') }}" width="60" height="60" alt="Логотип">
            </a>
            <input type="text" id="search" class="input search-input" placeholder="Может вопрос уже задан?">
            
            <div class="header-actions">
                {% if username %}
                    <button id="create" class="btn header-actions-create">Создать вопрос</button>
                    <a href="/profile/{{ username }}" class="link">{{ name }}</a>
                {% else %}
                    <a href="/login" class="link">Войти</a>
                {% endif %}
            </div>
        </header>
    </div>
    <main class="content">
        <h1 class="visually-hidden">Вопросы</h1>
        <section class="questions container tall-container">
            <div class="questions-item-filter">
                <select class="item-filter" id="subject">
                    <option value="all" selected>Все предметы</option>
                    <option value="math">Математика</option>
                    <option value="russian">Русский язык</option>
                    <option value="literature">Литература</option>
                    <option value="english">Английский язык</option>
                    <option value="german">Немецкий язык</option>
                    <option value="french">Французский язык</option>
                    <option value="biology">Биология</option>
                    <option value="chemistry">Химия</option>
                    <option value="physics">Физика</option>
                    <option value="geography">География</option>
                    <option value="history">История</option>
                    <option value="social_studies">Обществознание</option>
                    <option value="computer_science">Информатика</option>
                    <option value="music">Музыка</option>
                    <option value="art">ИЗО</option>
                    <option value="pe">Физическая культура</option>
                </select>

                <select class="item-filter" id="grade">
                    <option value="all" selected>Все классы</option>
                    <option value="1-4">1 - 4 классы</option>
                    <option value="5-9">5 - 9 классы</option>
                    <option value="10-11">10 - 11 классы</option>
                </select>
            </div>
            <div>
                <ul id="questionsList" class="questions-content-list">
                </ul>
            </div>
        </section>
        <div class="overlay" id="overlayCreate">
            <section class="create">
                <button class="create-close-btn" id="close">
                    <img src="{{ url_for('static', path='imgs/close.svg') }}" alt="Закрыть">
                </button>
                <form action="/doadd" method="post" class="create-form" enctype="multipart/form-data" id="formCreateQuestion">
                    <div class="create-form-text">
                        <label for="questionText">Какой у вас вопрос?</label>
                        <textarea class="form-text-textarea" name="description" id="questionText" minlength="0" maxlength="10000" required></textarea>
                    </div>
                    <div class="create-form-section">
                        <select class="item-filter" name="subject">
                            <option value="Математика" selected>Математика</option>
                            <option value="Русский язык">Русский язык</option>
                            <option value="Литература">Литература</option>
                            <option value="Английский язык">Английский язык</option>
                            <option value="Немецкий язык">Немецкий язык</option>
                            <option value="Французский язык">Французский язык</option>
                            <option value="Биология">Биология</option>
                            <option value="Химия">Химия</option>
                            <option value="Физика">Физика</option>
                            <option value="География">География</option>
                            <option value="История">История</option>
                            <option value="Обществознание">Обществознание</option>
                            <option value="Информатика">Информатика</option>
                            <option value="Музыка">Музыка</option>
                            <option value="ИЗО">ИЗО</option>
                            <option value="Физическая культура">Физическая культура</option>
                        </select>

                        <select class="item-filter" name="grade">
                            <option value="1" selected>1 класс</option>
                            <option value="2">2 класс</option>
                            <option value="3">3 класс</option>
                            <option value="4">4 класс</option>
                            <option value="5">5 класс</option>
                            <option value="6">6 класс</option>
                            <option value="7">7 класс</option>
                            <option value="8">8 класс</option>
                            <option value="9">9 класс</option>
                            <option value="10">10 класс</option>
                            <option value="11">11 класс</option>
                        </select>
                    </div>
                    <div class="upload-container">
                        <label class="upload-label" for="imageInputCreateQuestion">
                            <img src="{{ url_for('static', path='imgs/clip.svg') }}" alt="Прикрепить файл">
                            Прикрепить изображения
                        </label>
                        <input class="visually-hidden" type="file" id="imageInputCreateQuestion" name="images" accept="image/*" multiple>

                        <ul class="preview-list" id="previewListCreateQuestion"></ul>
                    </div>
                    <button type="submit" class="btn">Создать вопрос</button>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
